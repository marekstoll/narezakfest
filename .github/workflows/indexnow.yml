name: IndexNow after Pages deployment

on:
  workflow_run:
    workflows: ["pages build and deployment", "pages-build-deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: indexnow-narezakfest
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published URLs and submit to IndexNow
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          import xml.etree.ElementTree as ET

          BASE = 'https://narezakfest.com'
          KEY = 'd43dde899e91c240f5f0b7487281c1f5'
          KEY_URL = BASE + '/' + KEY + '.txt'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Narezakfest-IndexNow/1.0', 'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  if urllib.parse.urlsplit(response.url).hostname != 'narezakfest.com':
                      raise RuntimeError('Unexpected redirect outside canonical host')
                  return response.read()

          for attempt in range(6):
              try:
                  if get(KEY_URL).decode('utf-8-sig').strip() != KEY:
                      raise RuntimeError('Public key file content does not match')
                  xml = get(BASE + '/sitemap.xml')
                  root = ET.fromstring(xml)
                  urls = list(dict.fromkeys(el.text.strip() for el in root.findall('{*}url/{*}loc') if el.text))
                  if not urls or len(urls) > 10000:
                      raise RuntimeError('Sitemap URL count is invalid')
                  for url in urls:
                      parts = urllib.parse.urlsplit(url)
                      if parts.scheme != 'https' or parts.netloc != 'narezakfest.com' or parts.fragment:
                          raise RuntimeError('Non-canonical sitemap URL: ' + url)
                      get(url)
                  break
              except Exception as exc:
                  if attempt == 5:
                      raise
                  print(f'Public deployment not ready ({exc}); retrying in 10s')
                  time.sleep(10)

          payload = {'host':'narezakfest.com','key':KEY,'keyLocation':KEY_URL,'urlList':urls}
          request = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(payload).encode(), headers={'Content-Type':'application/json; charset=utf-8','User-Agent':'Narezakfest-IndexNow/1.0'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read().decode(errors='replace')
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read().decode(errors='replace')

          print('IndexNow HTTP:', status)
          print('Response body:', body or '(empty)')
          print('Submitted URLs:', json.dumps(urls,ensure_ascii=False))
          meaning = {200:'URL submitted successfully. This does not confirm indexing.',202:'URLs received; IndexNow key validation is pending. This does not confirm indexing.'}.get(status,'Submission failed; inspect response body and HTTP status.')
          print(meaning)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write(f'## IndexNow HTTP {status}\n\n{meaning}\n\nKey: {KEY_URL}\n\n')
              summary.write('\n'.join('- '+url for url in urls)+'\n')
          if status not in (200,202):
              raise SystemExit(1)
          PYCODE
